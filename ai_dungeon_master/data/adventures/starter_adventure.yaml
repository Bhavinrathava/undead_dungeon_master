title: "The Medallion of Hodenfort"
setting: >
  A grim, low-fantasy world where the roads between towns are dangerous and trust is scarce.
  The Ninger Brotherhood — a secretive order of elven assassins — operate in the wilderness
  between settlements, preying on merchants and travelers. The Church of the Undying watches
  from Hodenfort, its priests serving Morrath, the god of undead. Tone is dark, tense, and
  grounded. No heroic fanfare — just survival and coin.

premise: >
  The merchant Damien has hired you to escort a sealed iron medallion from Svengard to
  Hodenfort. He is tight-lipped about its purpose, saying only that it must reach High Priest
  Helgen at the Church of the Undying before the new moon. You depart at dawn on an oxcart,
  the medallion locked in a small iron chest beneath the driver's bench. The road to Hodenfort
  is two days' travel through open farmland and then dense forest. Damien waves you off from
  his shop doorway, not meeting your eyes.

win_condition: "The party reaches the Ninger Brotherhood cave hideout."
fail_condition: "The entire party is killed or the medallion is lost."

dm_notes: >
  Damien is hiding something — he knows the medallion is being hunted, which is why he hired
  escorts rather than sending a courier. Do not reveal this unless players press him hard before
  departure or find the journal in the hideout. Helgen and the Church of the Undying are not
  villains in this adventure — save that for later. The Ninger elves want the medallion but do
  not know what it does. Keep pacing tight: Svengard is just a send-off, the road is atmosphere,
  the ambush is the first real tension, and the hideout is the payoff.

