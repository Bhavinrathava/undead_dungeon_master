  # ---- 4. FOREST TRAIL ----------------------------------------------------
  - id: "forest_trail"
    name: "The Forest Trail"
    description: >
      A narrow path beaten into the undergrowth heading north from the ambush site. It is not
      a road — more like a route used repeatedly. Broken branches, scuffed bark, a piece of
      dark cloth caught on a thorn. The trees thicken as the path descends into a shallow
      ravine. Woodsmoke. Then, at the base of the ravine, a cave mouth framed by stacked
      stones — deliberately concealed but not concealed enough.
    connections: ["ambush_site", "ninger_hideout"]
    lore:
      - "A Survival check (DC 10) confirms the trail is used regularly — multiple sets of boots, all light-footed."
      - "The woodsmoke is coming from inside the cave. Someone is still there."
      - "A Perception check (DC 13) near the cave entrance spots a trip-wire across the path — a warning bell, not a weapon."
    encounters: []
    items: ["piece of dark cloth (Ninger)"]
    npcs: []

  # ---- 5. NINGER HIDEOUT --------------------------------------------------
  - id: "ninger_hideout"
    name: "The Ninger Brotherhood Hideout"
    description: >
      A cave roughly twenty feet deep, shored up with timber beams. A fire burns low in a
      stone ring at the center. Bedrolls for six line the walls — only three are occupied by
      the scouts who stayed behind. Crates of stolen goods are stacked along one wall. On a
      rough-hewn table near the back: a map, a ledger, and a sealed letter addressed to
      'V' — Varek. This is the end of the road for now. Whatever is written in that letter,
      and whatever the medallion truly is, will have to wait.
    connections: ["forest_trail"]
    lore:
      - "The ledger lists six contracts in the last three months — three thefts, two assassinations, one listed only as 'retrieval: M.'"
      - "The map shows Svengard, Hodenfort, and a third location marked only with a symbol matching the medallion."
      - "The sealed letter (Varek's orders) reads: 'Retrieve the Morrath seal by any means. Do not open it. Deliver to the Vault.'"
      - "A hidden compartment under one of the crates contains 40 gold pieces and a vial of black liquid (poison, unidentified)."
    encounters:
      - id: "hideout_guards"
        name: "Hideout Guard Encounter"
        trigger: "on_enter"
        description: >
          Three Ninger scouts are in the cave — one tending the fire, two sleeping. If the party
          enters quietly (Stealth DC 13), they can get the drop on them. If not, the scouts
          wake and fight. They will not surrender — Brotherhood discipline.
        success_outcome: >
          The guards are defeated. The party has the hideout and everything in it. The adventure
          ends here — they have uncovered the Brotherhood's base, secured the medallion, and now
          hold intelligence about whoever sent Varek's orders. The road to Hodenfort still waits.
        failure_outcome: >
          The party is overwhelmed and captured. They wake bound inside the cave. A darker path begins.
        xp_reward: 150
        is_optional: false
