      INT: { score: 10, modifier: +0 }
      WIS: { score: 11, modifier: +0 }
      CHA: { score: 9,  modifier: -1 }

    saving_throws:           # Fighter proficiency: STR and CON
      STR: { modifier: +5, proficient: true }
      DEX: { modifier: +1, proficient: false }
      CON: { modifier: +4, proficient: true }
      INT: { modifier: +0, proficient: false }
      WIS: { modifier: +0, proficient: false }
      CHA: { modifier: -1, proficient: false }

    skills:                  # Proficient skills: Athletics, Intimidation, Perception, Survival
      Acrobatics:      { modifier: +1, proficient: false }   # DEX
      Animal_Handling: { modifier: +0, proficient: false }   # WIS
      Arcana:          { modifier: +0, proficient: false }   # INT
      Athletics:       { modifier: +5, proficient: true }    # STR
      Deception:       { modifier: -1, proficient: false }   # CHA
      History:         { modifier: +0, proficient: false }   # INT
      Insight:         { modifier: +0, proficient: false }   # WIS
      Intimidation:    { modifier: +1, proficient: true }    # CHA
      Investigation:   { modifier: +0, proficient: false }   # INT
      Medicine:        { modifier: +0, proficient: false }   # WIS
      Nature:          { modifier: +0, proficient: false }   # INT
      Perception:      { modifier: +2, proficient: true }    # WIS
      Performance:     { modifier: -1, proficient: false }   # CHA
      Persuasion:      { modifier: -1, proficient: false }   # CHA
      Religion:        { modifier: +0, proficient: false }   # INT
      Sleight_of_Hand: { modifier: +1, proficient: false }   # DEX
      Stealth:         { modifier: +1, proficient: false }   # DEX (disadvantage in heavy armour)
      Survival:        { modifier: +2, proficient: true }    # WIS

    passive_perception: 12   # 10 + Perception modifier

    feats:
      - name: "Shield Master"
        source: "Variant Human bonus feat"
        description: >
          When you take the Attack action on your turn while wielding a shield, you can use a
          bonus action to try to shove one creature within 5 ft. (DC 13 STR save or knocked
          prone / pushed 5 ft.). If a spell or effect deals half damage on a successful DEX
          save and targets only you, you take no damage on a success and half on a failure.

    class_features:
      - name: "Fighting Style: Protection"
        description: >
          When a creature you can see attacks a target other than you that is within 5 ft. of
          you, you can use your reaction to impose disadvantage on the attack roll. You must
          be wielding a shield.
      - name: "Second Wind"
        description: >
          Bonus action: regain 1d10 + 1 HP. Recharges on a short or long rest.

    background_feature: >
      Military Rank — Former soldiers and garrison troops recognize your rank. You can invoke
      this to requisition simple equipment or passage through military checkpoints.

    proficiencies:
      armor:     ["Light Armor", "Medium Armor", "Heavy Armor", "Shields"]
      weapons:   ["Simple Weapons", "Martial Weapons"]
      tools:     ["Dice Set", "Vehicles (land)"]
      languages: ["Common"]

    attacks:
      - name: "Longsword (one-handed)"
        attack_bonus: +5
        damage: "1d8+3"
        damage_type: "slashing"
        range: "5 ft. melee"
      - name: "Longsword (two-handed, no shield)"
        attack_bonus: +5
        damage: "1d10+3"
        damage_type: "slashing"
        range: "5 ft. melee"
      - name: "Shield Bash (Shield Master bonus action)"
        attack_bonus: "—"
        damage: "Shove only — target makes DC 13 STR save or is knocked prone / pushed 5 ft."
        damage_type: "bludgeoning"
        range: "5 ft. melee"

    attack_bonus: 5           # STR mod (+3) + proficiency (+2)
    damage_dice: "1d8+3"

    equipment:
      worn:    ["Chain Mail", "Shield"]
      carried: ["Longsword", "Explorer's Pack"]
    inventory: ["longsword", "chain mail", "shield", "torch x2", "rations x3", "explorer's pack"]

    personality_traits: "I face problems head-on. A simple, direct solution is the best path to success."
    ideals: "Responsibility. I do what I must and accept the consequences."
    bonds: "I fight for those who cannot fight for themselves."
    flaws: "I have little respect for anyone who is not a proven warrior."

# ---------------------------------------------------------------------------
# LOCATIONS
# ---------------------------------------------------------------------------

locations:

  # ---- 1. SVENGARD --------------------------------------------------------
  - id: "svengard"
    name: "Svengard"
    is_starting_location: true
    description: >
      A mid-sized market town with low stone walls and muddy streets. The smell of livestock
      and sawdust hangs in the air. It is early morning — shopkeepers are opening shutters,
      a dog barks somewhere near the well. Damien's shop sits on the eastern road, a faded
      painted sign of scales above the door. An oxcart waits outside, the ox already hitched
      and sullen-looking.
    connections: ["the_road"]
    lore:
      - "Svengard has no standing guard — only a night watchman, Old Petr, who is mostly deaf."
      - "The eastern road to Hodenfort runs through the Ashfeld forest. Merchants avoid it after dark."
      - "There have been three missing-merchant reports in the last two months. The town council blames wolves."
    npcs:
      - name: "Damien"
        role: "quest_giver"
        race: "Human"
        alignment: "Neutral"

        ability_scores:
          STR: { score: 9,  modifier: -1 }
          DEX: { score: 11, modifier: +0 }
          CON: { score: 12, modifier: +1 }
          INT: { score: 14, modifier: +2 }
          WIS: { score: 13, modifier: +1 }
          CHA: { score: 14, modifier: +2 }

        saving_throws:         # Non-combatant; no class proficiencies
          STR: { modifier: -1, proficient: false }
          DEX: { modifier: +0, proficient: false }
          CON: { modifier: +1, proficient: false }
          INT: { modifier: +2, proficient: false }
          WIS: { modifier: +1, proficient: false }
          CHA: { modifier: +2, proficient: false }

        skills:                # Merchant background: Deception, History, Insight, Persuasion
          Deception:   { modifier: +4, proficient: true }
          History:     { modifier: +4, proficient: true }
          Insight:     { modifier: +3, proficient: true }
          Persuasion:  { modifier: +4, proficient: true }
          Perception:  { modifier: +1, proficient: false }

        passive_perception: 11

        personality: "Nervous, businesslike, avoids eye contact. Speaks in short clipped sentences. Pays well but asks no questions."
        knowledge:
          - "The medallion must reach Helgen before the new moon — four days from now."
          - "The iron chest it sits in is locked. He gives the party the key."
          - "He refuses to say what the medallion does. If pushed hard: 'It's a religious artifact. Helgen will explain.'"
          - "He has heard rumors of trouble on the eastern road but dismisses them as merchant gossip."
        dialogue_hints: >
          Damien speaks quickly and wants the party gone before anyone sees them. He hands over
          a small iron key and a folded letter of introduction for Helgen. He does not say goodbye.
        secret:
          text: >
            Damien stole the medallion from the Ninger Brotherhood six months ago after finding it
            in a shipment of goods. He does not know its full power but knows the Brotherhood wants
            it back. He hired the party as unknowing bait — if the Brotherhood attacks them instead
            of him, he buys time. There is a coded note in his desk that hints at this, but the
            party has no reason to search his shop.
          concealment_reason: "fears retaliation from the Brotherhood if they learn he is talking"
          reveal_threshold: 15
          partial_reveal_threshold: 10
          skill_type: ["persuasion", "intimidation", "insight"]
          hints:
            - "goes rigid and changes the subject whenever the Ninger Brotherhood are mentioned"
            - "glances toward the locked desk drawer when asked about the medallion's origins"
    encounters: []
    items: ["iron chest (locked)", "letter of introduction for Helgen"]

  # ---- 2. THE ROAD --------------------------------------------------------
  - id: "the_road"
    name: "The Eastern Road"
    description: >
      A rutted dirt road cutting through open farmland that slowly gives way to the edge of
      Ashfeld forest. The oxcart sways and creaks. Crows watch from fence posts. By midday
      the trees close in on both sides and the light drops. Then, rounding a bend, the party
      sees it: a merchant's carriage overturned in the ditch, one wheel still spinning slowly.
      Two dead horses still in their traces. No sign of the driver.
    connections: ["svengard", "ambush_site"]
    lore:
      - "The overturned carriage bears the crest of House Varel — minor cloth merchants out of Hodenfort."
      - "The carriage has been ransacked. Bolts of cloth are scattered in the mud. A strongbox lies open and empty."
      - "A successful Perception check (DC 12) reveals elvish bootprints in the soft mud leading north into the trees."
      - "A successful Investigation check (DC 14) on the carriage finds a crossbow bolt lodged in the driver's bench — slender, black-fletched. Ninger make."
    encounters: []
    items: ["scattered cloth bolts (worthless)", "empty strongbox", "black-fletched crossbow bolt (clue)"]
    npcs: []

  # ---- 3. AMBUSH SITE -----------------------------------------------------
  - id: "ambush_site"
    name: "The Ambush"
    description: >
      Whether the party stops to investigate the carriage or tries to push past it, the attack
      comes the same way: two crossbow bolts from the treeline, then silence, then elves
      dropping from the branches onto the road. They are lean, dressed in dark leather, faces
      half-masked. The leader calls out in accented Common: "The chest. Leave it and we let
      you walk." They will not actually let them walk.
    connections: ["the_road", "forest_trail"]
    lore:
      - "The Ninger Brotherhood are elvish mercenaries-turned-thieves who operate across three kingdoms."
      - "They take contracts for theft and assassination. They do not leave witnesses as a rule."
      - "The leader, Varek, knows the medallion is in the chest but not what it does. He has orders to retrieve it."
    encounters:
      - id: "ninger_ambush"
        name: "Ninger Brotherhood Ambush"
        trigger: "on_enter"
        description: >
          Four Ninger elves emerge — two from the trees on each side of the road. Varek, the
          leader, stands in the center. He makes his demand once. If the party refuses or attacks,
          combat begins immediately. Varek will attempt to flee if reduced to 5 HP or fewer,
          heading north toward the hideout.
        success_outcome: >
          The elves are defeated or driven off. Varek, if not killed, flees into the trees.
          A trail of blood or footprints leads north — clearly toward something. The road to
          Hodenfort remains open but the party now knows they are being hunted.
        failure_outcome: >
          The party is subdued. The elves take the chest and leave the party bound to a tree.
          They can attempt to escape (DC 13 Strength or Dexterity check) but the medallion is gone.
        xp_reward: 200
        is_optional: false
